<div class="max-w-[1400px] mx-auto px-4 py-4">

    <div class="flex gap-2">

    <button data-tab="baixa" class="tab-btn text-[11px] px-4 py-2 rounded-lg border border-zinc-800 text-zinc-400">BAIXA PRODUÇÃO</button>

  <div id="tab-estoque" class="tab-panel mt-4">
    <div class="bg-[#151518] border border-zinc-800 rounded-xl p-4">

      <div class="mt-3 flex gap-2">
        <button id="btn-gerenciar" class="text-[11px] px-3 py-2 rounded-lg border border-zinc-800 bg-zinc-900">Gerenciar Ruas</button>
        <button id="btn-nova-rua" class="text-[11px] px-3 py-2 rounded-lg bg-white text-black font-bold">+ Nova Rua</button>
        <span id="rua-selecionada-label" class="text-[11px] text-zinc-500 py-2"></span>
      </div>
      <div id="grid-pos" class="mt-6 space-y-6"></div>

  <div id="tab-livre" class="tab-panel mt-4 hidden">
    <div class="bg-[#151518] border border-zinc-800 rounded-xl p-4">
      <div class="text-[11px] text-zinc-400 tracking-wide">XLSX / CSV / TXT - colunas: MATERIAL | TEXTO BREVE | UM | DEPÓSITO | QTD (UTILIZAÇÃO aceita como QTD para compatibilidade)</div>
      <div class="mt-3 flex flex-wrap gap-2">
        <button id="btn-import-xlsx" class="text-[11px] px-4 py-2 rounded-lg bg-white text-black font-bold border border-white">IMPORTAR XLSX</button>
        <button id="btn-import-csv" class="text-[11px] px-4 py-2 rounded-lg border border-zinc-800 bg-zinc-900">IMPORTAR CSV</button>
        <button id="btn-import-txt" class="text-[11px] px-4 py-2 rounded-lg border border-zinc-800 bg-zinc-900">IMPORTAR TXT</button>

        <table class="w-full text-[11px]">
          <thead class="bg-[#0e0e10] text-zinc-500"><tr><th class="text-left p-2">MATERIAL</th><th class="text-left p-2">TEXTO BREVE</th><th class="p-2">UM</th><th class="p-2">DEP</th><th class="p-2">QTD</th><th class="p-2">AÇÕES</th></tr></thead>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyADKjr_uc9_kI6MBJSF8dqLSyRKfm_jSsY",
  authDomain: "dg25-elgin.firebaseapp.com",
  projectId: "dg25-elgin",
  storageBucket: "dg25-elgin.firebasestorage.app",
  messagingSenderId: "630967075984",
  appId: "1:630967075984:web:712a7eb90ccd4cceb64415",
  measurementId: "G-5R6NFT3NY1",
  databaseURL: "https://dg25-elgin-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const LS = { ruas: 'wms_final_ruas', pos: 'wms_final_posicoes', livre: 'wms_final_material_livre' };
const NIVEIS=7, DIVS=10;
let ruas = JSON.parse(localStorage.getItem(LS.ruas)||'null') || Array.from({length:20},(_,i)=>({id:'R'+String(i+1).padStart(2,'0'), nome:'RUA '+String(i+1).padStart(2,'0')}));
let posicoes = JSON.parse(localStorage.getItem(LS.pos)||'{}');
let livre = JSON.parse(localStorage.getItem(LS.livre)||'null') || [
  {id:'m1', MATERIAL:'100234', TEXTO_BREVE:'PARAFUSO M6x20 INOX', UM:'PC', DEPOSITO:'A01', QTD:500, dataEntrada: Date.now()},
  {id:'m2', MATERIAL:'100235', TEXTO_BREVE:'PORCA M6 INOX', UM:'PC', DEPOSITO:'A01', QTD:1200, dataEntrada: Date.now()}
];
let selectedRua = ruas[0]?.id || 'R01';
let editingPosKey = null;

function saveAll(){
  localStorage.setItem(LS.ruas, JSON.stringify(ruas));
  localStorage.setItem(LS.pos, JSON.stringify(posicoes));
  localStorage.setItem(LS.livre, JSON.stringify(livre));
  try{ db.ref('wms_final/ruas').set(ruas); db.ref('wms_final/posicoes').set(posicoes); db.ref('wms_final/material_livre').set(livre); }catch(e){}
  updateHeader();
}
function updateHeader(){
  const total = ruas.length*NIVEIS*DIVS;
  document.getElementById('hdr-stats').textContent = ruas.length+' ruas • '+NIVEIS+' níveis • '+DIVS+' div • '+total+' posições • Firebase';
  const occ = Object.values(posicoes).filter(p=>p.materialId).length;
  document.getElementById('hdr-live').textContent = '• '+occ+' ocupadas • '+(total-occ)+' livres';
}
function occCount(){
  const m={}; Object.values(posicoes).forEach(p=>{ if(p.materialId){ m[p.ruaId]=(m[p.ruaId]||0)+1; } }); return m;
}
function renderRuasBar(){
  const bar=document.getElementById('ruas-bar'); const occ=occCount();
  bar.innerHTML='';
  ruas.forEach(r=>{
    const btn=document.createElement('button');
    const count=occ[r.id]||0;
    const isSel = r.id===selectedRua;
    btn.className = (isSel?'bg-white text-black border-white ':'bg-[#0e0e10] text-zinc-300 border-zinc-800 ')+'text-[11px] px-3 py-2 rounded-lg border font-bold flex items-center gap-2';
    btn.innerHTML = '<span>'+r.nome+'</span><span class="text-[10px] opacity-70">• '+count+'/70</span>';
    btn.onclick=()=>{ selectedRua=r.id; renderRuasBar(); renderGrid(); document.getElementById('rua-selecionada-label').textContent=r.id+' selecionada'; };
    btn.ondblclick=()=>{
      const novo=prompt('Editar nome da rua:', r.nome);
