<script>
var firebaseConfig={apiKey:"AIzaSyAxz99PYEfO54SeKt7vB13ijXXxryRGqlA",authDomain:"controle-de-estoque-98bf1.firebaseapp.com",databaseURL:"https://controle-de-estoque-98bf1-default-rtdb.firebaseio.com",projectId:"controle-de-estoque-98bf1",storageBucket:"controle-de-estoque-98bf1.firebasestorage.app",messagingSenderId:"845427057904",appId:"1:845427057904:web:5420867e521068763ace35"};
try{firebase.initializeApp(firebaseConfig);var db=firebase.database();}catch(e){}
var LS={materiais:"wms_final_material_livre",ruas:"wms_ruas_nomes",posicoes:"wms_final_posicoes",baixas:"wms_baixas"};
function genRuas(){var a=[];for(var i=1;i<=20;i++){var id="R"+String(i).padStart(2,"0");a.push({id:id,nome:"RUA "+String(i).padStart(2,"0")})}return a}
var MOCK=[{id:"m1",MATERIAL:"1000001",TEXTO_BREVE:"PARAFUSO M8 X 30 INOX",UTILIZACAO:"LIVRE",UM:"PC",DEPOSITO:"001",QTD:540},{id:"m2",MATERIAL:"1000002",TEXTO_BREVE:"PORCA M8 INOX",UTILIZACAO:"LIVRE",UM:"PC",DEPOSITO:"001",QTD:1200},{id:"m3",MATERIAL:"1000003",TEXTO_BREVE:"ARRUELA LISA M8 INOX",UTILIZACAO:"LIVRE",UM:"PC",DEPOSITO:"001",QTD:2400},{id:"m4",MATERIAL:"1000004",TEXTO_BREVE:"CHAPA ACO 2MM 1000x2000",UTILIZACAO:"LIVRE",UM:"PC",DEPOSITO:"002",QTD:18},{id:"m5",MATERIAL:"1000005",TEXTO_BREVE:"BARRA ROSCADA M10 X 1M",UTILIZACAO:"LIVRE",UM:"PC",DEPOSITO:"002",QTD:65},{id:"m6",MATERIAL:"1000006",TEXTO_BREVE:"BUCHA FIXACAO 8MM NYLON",UTILIZACAO:"LIVRE",UM:"PC",DEPOSITO:"001",QTD:890}];
var ruas=[],materiais=[],posicoes={},baixas=[],selectedRua="R01",currentAlocar=null,currentBaixa=null;
function loadLS(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function saveAll(){localStorage.setItem(LS.ruas,JSON.stringify(ruas));localStorage.setItem(LS.materiais,JSON.stringify(materiais));localStorage.setItem(LS.posicoes,JSON.stringify(posicoes));localStorage.setItem(LS.baixas,JSON.stringify(baixas));try{if(db){db.ref("wms_final/material_livre").set(materiais);db.ref("wms_final/ruas").set(ruas);db.ref("wms_final/posicoes").set(posicoes)}}catch(e){}}
function init(){ruas=loadLS(LS.ruas,genRuas());materiais=loadLS(LS.materiais,MOCK);posicoes=loadLS(LS.posicoes,{});baixas=loadLS(LS.baixas,[]);if(!Object.keys(posicoes).length){var map={};ruas.forEach(function(rua){for(var n=1;n<=7;n++){for(var d=1;d<=10;d++){var codigo=rua.id+"-N"+n+"-D"+String(d).padStart(2,"0");map[codigo]={codigo:codigo,rua:rua.id,nivel:n,div:d}}});map["R01-N1-D01"]={codigo:"R01-N1-D01",rua:"R01",nivel:1,div:1,materialId:"m1",qtd:120};map["R01-N2-D03"]={codigo:"R01-N2-D03",rua:"R01",nivel:2,div:3,materialId:"m2",qtd:300};map["R02-N1-D01"]={codigo:"R02-N1-D01",rua:"R02",nivel:1,div:1,materialId:"m3",qtd:500};map["R03-N3-D05"]={codigo:"R03-N3-D05",rua:"R03",nivel:3,div:5,materialId:"m4",qtd:5};posicoes=map}selectedRua=ruas[0].id;try{if(db){db.ref("wms_final/material_livre").on("value",function(s){var v=s.val();if(v){if(Array.isArray(v))materiais=v;else if(typeof v==="object")materiais=Object.values(v);renderMateriais()}});db.ref("wms_final/ruas").on("value",function(s){var v=s.val();if(v){ruas=Array.isArray(v)?v:Object.values(v);renderRuas()}});db.ref("wms_final/posicoes").on("value",function(s){var v=s.val();if(v){posicoes=v;renderEstoque()}})}}catch(e){}renderRuas();renderMateriais();renderEstoque();renderBaixas();}
function switchTab(t){document.getElementById("view-estoque").classList.add("hidden");document.getElementById("view-material").classList.add("hidden");document.getElementById("view-baixa").classList.add("hidden");document.getElementById("view-"+t).classList.remove("hidden");["estoque","material","baixa"].forEach(function(k){var el=document.getElementById("tab-"+k);if(k===t){el.className="px-5 py-2 rounded-full text-[11px] font-semibold tracking-widest bg-white text-black"}else{el.className="px-5 py-2 rounded-full text-[11px] font-semibold tracking-widest text-zinc-400"}})}
function countsRua(id){var c=0;Object.values(posicoes).forEach(function(p){if(p.rua===id&&p.materialId)c++});return c}
function renderRuas(){var bar=document.getElementById("ruas-bar");bar.innerHTML="";ruas.forEach(function(rua){var cnt=countsRua(rua.id);var btn=document.createElement("button");btn.className=(selectedRua===rua.id?"h-8 px-3 rounded-full border text-[11px] font-semibold tracking-wide bg-white text-black border-white":"h-8 px-3 rounded-full border text-[11px] font-semibold tracking-wide bg-[#1e1e22] border-zinc-800 text-zinc-400");btn.innerHTML=rua.nome+" • "+cnt+"/70";btn.onclick=function(){selectedRua=rua.id;renderRuas();renderEstoque()};btn.ondblclick=function(){var novo=prompt("Editar rua:",rua.nome);if(novo){rua.nome=novo;saveAll();renderRuas()}};bar.appendChild(btn)});var manage=document.getElementById("ruas-manage-list");if(manage){manage.innerHTML="";ruas.forEach(function(rua){var div=document.createElement("div");div.className="flex items-center gap-2 p-2 rounded-full bg-[#0e0e10] border border-zinc-800";div.innerHTML='<span class="text-[11px] text-zinc-500 w-10">'+rua.id+'</span><input value="'+rua.nome+'" oninput="editRuaName(\\''+rua.id+'\\',this.value)" class="flex-1 bg-transparent text-[11px] text-white focus:outline-none"><button onclick="deleteRua(\\''+rua.id+'\\')" class="h-7 w-7 rounded-full bg-red-950/40 border border-red-900/30 text-red-300 text-[12px]">×</button>';manage.appendChild(div)})}}
function editRuaName(id,val){var r=ruas.find(function(x){return x.id===id});if(r){r.nome=val;saveAll()}}
function renderEstoque(){document.getElementById("rua-title").textContent=(ruas.find(function(r){return r.id===selectedRua})||{}).nome+" • GRID 7N x 10D";var used=countsRua(selectedRua);document.getElementById("rua-stats").textContent=used+" ocupadas • "+(70-used)+" livres";var grid=document.getElementById("grid-estoque");grid.innerHTML="";for(var nivel=7;nivel>=1;nivel--){var row=document.createElement("div");row.className="flex gap-2";var label=document.createElement("div");label.className="w-12 shrink-0 h-14 md:h-16 flex items-center justify-center rounded-lg bg-[#0e0e10] border border-zinc-800 text-[10px] text-zinc-500 font-semibold";label.textContent="N"+nivel;row.appendChild(label);var cols=document.createElement("div");cols.className="grid grid-cols-5 md:grid-cols-10 gap-2 flex-1";for(var d=1;d<=10;d++){var codigo=selectedRua+"-N"+nivel+"-D"+String(d).padStart(2,"0");var pos=posicoes[codigo]||{codigo:codigo,rua:selectedRua,nivel:nivel,div:d};var occ=!!pos.materialId;var mat=materiais.find(function(m){return m.id===pos.materialId});var btn=document.createElement("button");btn.className=occ?"h-14 md:h-16 rounded-lg border text-left p-2 flex flex-col justify-between bg-white border-white text-black":"h-14 md:h-16 rounded-lg border text-left p-2 flex flex-col justify-between bg-[#0e0e10] border-zinc-800 text-zinc-500 hover:border-zinc-700";btn.innerHTML='<span class="text-[9px] tracking-widest font-semibold text-zinc-600">'+pos.codigo+'</span>'+(occ?'<span class="text-[9px] md:text-[10px] font-semibold leading-tight truncate text-black">'+(mat?mat.TEXTO_BREVE:pos.materialId)+'</span><span class="text-[9px] px-1.5 py-0.5 rounded-full bg-black text-white w-fit">'+pos.qtd+'</span>':'<span class="text-[10px] text-zinc-700">LIVRE</span>');(function(p){btn.onclick=function(){if(p.materialId)openBaixa(p);else openAlocar(p)}})(pos);cols.appendChild(btn)}row.appendChild(cols);grid.appendChild(row)}}
function renderMateriais(){var tbody=document.getElementById("tbody-materiais");var search=(document.getElementById("searchInput").value||"").toLowerCase();var filtered=materiais.filter(function(m){return !search||m.MATERIAL.toLowerCase().includes(search)||m.TEXTO_BREVE.toLowerCase().includes(search)});document.getElementById("count-skus").textContent=filtered.length+" filtrados • "+materiais.length+" SKUs";document.getElementById("count-qtd").textContent=materiais.reduce(function(a,b){return a+b.QTD},0)+" un total";tbody.innerHTML="";filtered.forEach(function(m){var tr=document.createElement("tr");tr.className="hover:bg-[#1a1a1e]";tr.innerHTML='<td class="px-4 py-2.5 text-zinc-200 font-medium">'+m.MATERIAL+'</td><td class="px-4 py-2.5 text-zinc-300 max-w-[260px] truncate">'+m.TEXTO_BREVE+'</td><td class="px-4 py-2.5"><span class="inline-flex px-2 py-0.5 rounded-full bg-[#1e1e22] border border-zinc-800 text-[10px] text-zinc-400">'+m.UTILIZACAO+'</span></td><td class="px-4 py-2.5 text-zinc-400">'+m.UM+'</td><td class="px-4 py-2.5 text-zinc-400">'+m.DEPOSITO+'</td><td class="px-4 py-2.5"><span class="px-2 py-1 rounded-full text-[11px] font-semibold '+(m.QTD>0?'bg-white text-black':'bg-zinc-800 text-zinc-500')+'">'+m.QTD+'</span></td><td class="px-4 py-2.5 text-right"><div class="inline-flex gap-1"><button onclick="quickAlocar(\\''+m.id+'\\')" class="h-6 px-2 rounded-full bg-[#252529] border border-zinc-800 text-[10px] text-zinc-300">ALOCAR</button><button onclick="deleteMat(\\''+m.id+'\\')" class="h-6 w-6 rounded-full bg-[#1e1e22] border border-zinc-800 text-zinc-500">×</button></div></td>';tbody.appendChild(tr)});var sel=document.getElementById("alocar-select");if(sel){sel.innerHTML="";materiais.filter(function(m){return m.QTD>0}).forEach(function(m){var opt=document.createElement("option");opt.value=m.id;opt.textContent=m.MATERIAL+" • "+m.TEXTO_BREVE+" • "+m.QTD+" "+m.UM;sel.appendChild(opt)})}}
function renderBaixas(){var tbody=document.getElementById("tbody-baixas");tbody.innerHTML="";baixas.forEach(function(b){var tr=document.createElement("tr");tr.className="hover:bg-[#1a1a1e]";tr.innerHTML='<td class="px-4 py-2.5 text-zinc-500">'+b.data+'</td><td class="px-4 py-2.5 text-zinc-300 font-medium">'+b.codigoPos+'</td><td class="px-4 py-2.5 text-zinc-200 truncate max-w-[260px]">'+b.material+'</td><td class="px-4 py-2.5"><span class="px-2 py-0.5 rounded-full bg-white text-black font-semibold text-[11px]">'+b.qtd+'</span></td>';tbody.appendChild(tr)})}
function openNovo(){document.getElementById("modal-novo").classList.remove("hidden");document.getElementById("modal-novo").classList.add("flex")}
function closeNovo(){document.getElementById("modal-novo").classList.add("hidden");document.getElementById("modal-novo").classList.remove("flex")}
function saveNovo(){var m=document.getElementById("n-material").value;var tb=document.getElementById("n-texto").value;if(!m||!tb){alert("Preencha MATERIAL e TEXTO BREVE");return}var novo={id:"m_"+Date.now(),MATERIAL:m,TEXTO_BREVE:tb,UTILIZACAO:document.getElementById("n-util").value||"LIVRE",UM:document.getElementById("n-um").value||"PC",DEPOSITO:document.getElementById("n-deposito").value||"001",QTD:Number(document.getElementById("n-qtd").value||0)};materiais.unshift(novo);saveAll();renderMateriais();closeNovo();document.getElementById("live-feedback").textContent="Novo "+m+" adicionado • live"}
function deleteMat(id){materiais=materiais.filter(function(m){return m.id!==id});saveAll();renderMateriais()}
function quickAlocar(id){currentAlocar={codigo:selectedRua+"-N1-D01",rua:selectedRua,nivel:1,div:1};document.getElementById("alocar-select").value=id;openAlocar({codigo:selectedRua+"-N1-D01",rua:selectedRua,nivel:1,div:1})}
function openAlocar(pos){currentAlocar=pos;document.getElementById("alocar-title").textContent="ALOCAR EM "+pos.codigo;document.getElementById("modal-alocar").classList.remove("hidden");document.getElementById("modal-alocar").classList.add("flex")}
function closeAlocar(){document.getElementById("modal-alocar").classList.add("hidden");document.getElementById("modal-alocar").classList.remove("flex")}
function doAlocar(){if(!currentAlocar)return;var matId=document.getElementById("alocar-select").value;var qtd=Number(document.getElementById("alocar-qtd").value||1);var mat=materiais.find(function(m){return m.id===matId});if(!mat||qtd>mat.QTD){alert("QTD insuficiente");return}posicoes[currentAlocar.codigo]={codigo:currentAlocar.codigo,rua:currentAlocar.rua,nivel:currentAlocar.nivel,div:currentAlocar.div,materialId:mat.id,qtd:qtd};mat.QTD-=qtd;saveAll();renderMateriais();renderEstoque();closeAlocar()}
