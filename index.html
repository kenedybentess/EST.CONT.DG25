<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WMS Controle Estoque Multi-SKU - dg25-elgin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{background:#0e0e10;color:#e4e4e7;font-family:Inter,system-ui,sans-serif}

::-webkit-scrollbar-thumb{background:#27272a;border-radius:10px}

<body class="min-h-screen">
<div id="app"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyADKjr_uc9_kI6MBJSF8dqLSyRKfm_jSsY",
  authDomain: "dg25-elgin.firebaseapp.com",
  databaseURL: "https://dg25-elgin-default-rtdb.firebaseio.com/",
  projectId: "dg25-elgin",
  storageBucket: "dg25-elgin.firebasestorage.app",
  messagingSenderId: "630967075984",
  appId: "1:630967075984:web:712a7eb90ccd4cceb64415",
  measurementId: "G-5R6NFT3NY1"
};
let db=null, firebaseConnected=false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  firebaseConnected=true;
}catch(e){console.warn(e)}

const LS_MAT = "wms_final_material_livre";
const LS_RUAS = "wms_ruas_nomes";
const LS_POS = "wms_final_posicoes";

const defaultRuas = Array.from({length:20},(_,i)=>`RUA ${String(i+1).padStart(2,"0")}`);
const defaultMats = [
{id:"m1",material:"1000234",texto:"PARAFUSO M8 X 30 INOX",um:"PC",deposito:"100",qtd:500},
{id:"m2",material:"1000891",texto:"CHAPA ACO 1020 3MM",um:"KG",deposito:"100",qtd:120},
{id:"m3",material:"1001120",texto:"MOTOR ELETRICO 2CV",um:"PC",deposito:"200",qtd:12},
{id:"m4",material:"1001345",texto:"ROLAMENTO 6205 ZZ",um:"PC",deposito:"100",qtd:240},
];

let ruas = (()=>{try{let v=localStorage.getItem(LS_RUAS); if(v) return JSON.parse(v)}catch{} return defaultRuas})();
let materiais = (()=>{try{let v=localStorage.getItem(LS_MAT); if(v) return JSON.parse(v)}catch{} return defaultMats})();
let posicoes = (()=>{try{let v=localStorage.getItem(LS_POS); if(v) return JSON.parse(v)}catch{} return {
"R01-N1-D01":{posId:"R01-N1-D01",ruaIndex:0,nivel:1,div:1,materialId:"m1",materialCodigo:"1000234",qtd:200},
"R01-N1-D02":{posId:"R01-N1-D02",ruaIndex:0,nivel:1,div:2,materialId:"m2",materialCodigo:"1000891",qtd:50}
}})();

let tab="estoque";
let ruaSel=null;
let busca="";
let editingRua=null;
let showGerenciar=false;

function posId(ruaIndex,nivel,div){
  return `R${String(ruaIndex+1).padStart(2,"0")}-N${nivel}-D${String(div).padStart(2,"0")}`;
}
function saveLocal(){
  localStorage.setItem(LS_RUAS, JSON.stringify(ruas));
  localStorage.setItem(LS_MAT, JSON.stringify(materiais));
  localStorage.setItem(LS_POS, JSON.stringify(posicoes));
}
function saveFirebase(){
  if(!db) return;
  try{
    db.ref("wms_final/ruas").set(ruas);
    db.ref("wms_final/material_livre").set(materiais);
    db.ref("wms_final/posicoes").set(posicoes);
  }catch(e){console.warn(e)}
}

function loadFirebase(){
  if(!db) return;
  db.ref("wms_final/ruas").on("value", snap=>{
    if(snap.val()){ ruas=snap.val(); saveLocal(); render(); }
  });
  db.ref("wms_final/material_livre").on("value", snap=>{
    if(snap.val()){ materiais=snap.val(); saveLocal(); render(); }
  });
  db.ref("wms_final/posicoes").on("value", snap=>{
    if(snap.val()){ posicoes=snap.val(); saveLocal(); render(); }
  });
}

function render(){
  const app=document.getElementById("app");
  const totalPos=ruas.length*7*10;
  const ocupadas=Object.keys(posicoes).length;
  const filteredMats = materiais.filter(m=>{
    if(!busca) return true;
    const b=busca.toLowerCase();
    return (m.material+" "+m.texto+" "+m.deposito).toLowerCase().includes(b);
  });

  app.innerHTML=`
  <header class="sticky top-0 z-40 backdrop-blur bg-[#0e0e10]/90 border-b border-zinc-800">
    <div class="mx-auto max-w-[1600px] px-4 md:px-6 py-3 flex items-center justify-between">
      <div>
        <div class="font-bold tracking-tight text-[15px] md:text-[16px]">WMS Controle Estoque Multi-SKU</div>
        <div class="text-[11px] text-zinc-400 mono">${ruas.length} ruas • 7 níveis • 10 div • ${totalPos} posições • ${firebaseConnected?'Firebase':'Offline'}</div>
      </div>
      <div class="flex items-center gap-2">
        <div class="text-[10px] mono px-2 py-1 rounded-full border ${firebaseConnected?'bg-emerald-500/10 border-emerald-500/20 text-emerald-300':'bg-zinc-800 border-zinc-700 text-zinc-400'}">${firebaseConnected?'● Conectado':'○ Offline'}</div>
      </div>
    </div>
  </header>

  <div class="mx-auto max-w-[1600px] px-4 md:px-6 mt-4">
    <div class="text-[10px] mono text-zinc-500 mb-2">XLSX / CSV / TXT - colunas: MATERIAL | TEXTO BREVE | UM | DEPÓSITO | QTD</div>
    <div class="flex flex-wrap gap-2 mb-2">
      <label class="h-9 px-3 rounded-lg bg-white text-black text-[11px] font-bold mono flex items-center gap-1.5 cursor-pointer hover:bg-zinc-200 transition">📥 IMPORTAR XLSX<input type="file" accept=".xlsx,.xls" class="hidden" id="fileXlsx"></label>
      <label class="h-9 px-3 rounded-lg bg-[#1e1e20] border border-zinc-700 text-[11px] font-bold mono flex items-center gap-1.5 cursor-pointer hover:bg-zinc-800 transition">📄 IMPORTAR CSV<input type="file" accept=".csv" class="hidden" id="fileCsv"></label>
      <label class="h-9 px-3 rounded-lg bg-[#1e1e20] border border-zinc-700 text-[11px] font-bold mono flex items-center gap-1.5 cursor-pointer hover:bg-zinc-800 transition">📃 IMPORTAR TXT<input type="file" accept=".txt" class="hidden" id="fileTxt"></label>
      <button onclick="zerarBase()" class="h-9 px-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-300 text-[11px] mono hover:bg-red-500/20 transition">ZERAR BASE</button>
    </div>
    <div id="feedback" class="h-6 mt-1 text-[11px] mono"></div>
  </div>

  <div class="mx-auto max-w-[1600px] px-4 md:px-6 mt-2">
    <div class="flex items-center gap-2 p-1 rounded-xl bg-[#151518] border border-zinc-800 w-fit">
      <button onclick="setTab('estoque')" class="h-8 px-4 rounded-lg text-[11px] font-bold mono flex items-center gap-1.5 ${tab==='estoque'?'bg-white text-black':'text-zinc-400 hover:text-zinc-200'}">📦 ESTOQUE</button>
      <button onclick="setTab('livre')" class="h-8 px-4 rounded-lg text-[11px] font-bold mono flex items-center gap-1.5 ${tab==='livre'?'bg-white text-black':'text-zinc-400 hover:text-zinc-200'}">📋 MATERIAL LIVRE</button>
      <button onclick="setTab('baixa')" class="h-8 px-4 rounded-lg text-[11px] font-bold mono flex items-center gap-1.5 ${tab==='baixa'?'bg-white text-black':'text-zinc-400 hover:text-zinc-200'}">⬇ BAIXA PRODUÇÃO</button>
    </div>
  </div>

  <main class="mx-auto max-w-[1600px] px-4 md:px-6 py-4 pb-12">
    ${tab==='livre'?`
      <div class="rounded-xl border border-zinc-800 bg-[#151518] overflow-hidden">
        <div class="p-4 flex flex-col md:flex-row gap-3 items-start md:items-center justify-between border-b border-zinc-800">
          <div class="flex items-center gap-3">
            <div class="text-[13px] font-semibold">Material Livre</div>
            <div class="text-[11px] mono px-2 py-1 rounded-full bg-[#1e1e20] border border-zinc-800 text-zinc-400">${materiais.length} SKUs • ${ocupadas}/${totalPos} posições</div>
          </div>
          <div class="flex items-center gap-2 w-full md:w-auto">
            <div class="relative w-full md:w-[320px]">
              <input id="buscaInput" value="${busca}" placeholder="Buscar material, texto, depósito..." class="w-full h-9 pl-3 pr-3 rounded-lg bg-[#0e0e10] border border-zinc-800 text-[12px] outline-none focus:border-zinc-700">
            </div>
            <button onclick="novoMaterial()" class="h-9 px-3 rounded-lg bg-white text-black text-[11px] font-bold mono">+ NOVO</button>
          </div>
        </div>
        <div class="overflow-auto">
          <table class="w-full text-left">
            <thead class="bg-[#1e1e20] border-b border-zinc-800 text-[10px] mono text-zinc-400 tracking-widest">
              <tr><th class="px-4 py-3">MATERIAL</th><th class="px-4 py-3">TEXTO BREVE</th><th class="px-4 py-3">UM</th><th class="px-4 py-3">DEPÓSITO</th><th class="px-4 py-3">QTD</th><th class="px-4 py-3">AÇÕES</th></tr>
            </thead>
            <tbody class="divide-y divide-zinc-800/60">
              ${filteredMats.length===0?`<tr><td colspan=6 class="px-4 py-12 text-center text-zinc-500 text-[12px] mono">Nenhum material. Importe XLSX/CSV/TXT ou cadastre manualmente.</td></tr>`:
                filteredMats.map(m=>`<tr class="hover:bg-[#1e1e20]/60 text-[12px]">
                  <td class="px-4 py-2.5 mono font-medium text-white">${m.material}</td>
                  <td class="px-4 py-2.5 text-zinc-300 max-w-[360px] truncate">${m.texto}</td>
                  <td class="px-4 py-2.5 mono"><span class="px-2 py-0.5 rounded bg-[#1e1e20] border border-zinc-800 text-[10px]">${m.um}</span></td>
                  <td class="px-4 py-2.5 mono text-zinc-400">${m.deposito}</td>
                  <td class="px-4 py-2.5 mono font-bold">${m.qtd||0}</td>
                  <td class="px-4 py-2.5"><button onclick="excluirMat('${m.id}')" class="h-7 w-7 grid place-items-center rounded bg-[#1e1e20] border border-zinc-800 hover:bg-red-500/10 hover:text-red-300">🗑</button></td>
                </tr>`).join('')
              }
            </tbody>
          </table>
        </div>
      </div>
    `:''}

    ${tab==='estoque'?`
      <div class="space-y-4">
        <div class="flex flex-wrap gap-2 items-center">
          ${ruas.map((r,i)=>{
            const count=Object.values(posicoes).filter(p=>p.ruaIndex===i).length;
            const sel=ruaSel===i;
            if(editingRua===i){
              return `<div class="flex items-center gap-1"><input id="editRuaInput" value="${r}" class="h-8 px-2 rounded-lg bg-[#0e0e10] border border-zinc-700 text-[11px] mono w-[140px]" onkeydown="if(event.key==='Enter')salvarRua(${i})" onblur="salvarRua(${i})" autofocus><button onclick="salvarRua(${i})" class="h-8 px-2 rounded bg-white text-black text-[10px] font-bold">OK</button></div>`;
            }
            return `<button ondblclick="editarRua(${i})" onclick="selecionarRua(${i})" class="h-8 px-3 rounded-lg border text-[11px] mono font-medium ${sel?'bg-white text-black border-white':'bg-[#151518] border-zinc-800 text-zinc-400 hover:bg-[#1e1e20] hover:text-zinc-200'}">${r} • ${count}/70</button>`;
          }).join('')}
          <button onclick="abrirGerenciar()" class="h-8 px-3 rounded-lg bg-[#1e1e20] border border-zinc-700 text-[11px] mono text-zinc-300 hover:bg-zinc-800">⚙️ Gerenciar Ruas</button>
        </div>

        ${(ruaSel!==null?[ruaSel]:ruas.map((_,i)=>i)).map(ri=>`
          <div class="rounded-xl border border-zinc-800 bg-[#151518] overflow-hidden">
            <div class="p-3 border-b border-zinc-800 bg-[#1e1e20]/50 flex justify-between">
              <div class="text-[12px] font-bold mono">${ruas[ri]}</div>
              <div class="text-[10px] mono text-zinc-500">${Object.values(posicoes).filter(p=>p.ruaIndex===ri).length} ocupadas</div>
            </div>
            <div class="p-3 grid grid-cols-2 md:grid-cols-7 gap-3">
              ${Array.from({length:7},(_,nivelIdx)=>{
                const nivel=nivelIdx+1;
                return `<div class="rounded-lg bg-[#0e0e10] border border-zinc-800 p-2"><div class="text-[10px] mono text-zinc-500 mb-2">NÍVEL ${nivel}</div><div class="grid grid-cols-5 gap-1">
                  ${Array.from({length:10},(_,divIdx)=>{
                    const div=divIdx+1;
                    const pid=posId(ri,nivel,div);
                    const occ=posicoes[pid];
                    return `<div title="${pid}${occ?` - ${occ.materialCodigo} Qtd:${occ.qtd}`:''}" class="h-8 rounded border text-[9px] mono grid place-items-center cursor-pointer ${occ?'bg-violet-500/20 border-violet-500/30 text-violet-300':'bg-[#151518] border-zinc-800 text-zinc-600 hover:border-zinc-700'}">${div}</div>`;
                  }).join('')}
                </div></div>`;
              }).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `:''}

    ${tab==='baixa'?`<div class="rounded-xl border border-zinc-800 bg-[#151518] p-8 text-center text-zinc-500 mono text-[12px]">Aba Baixa Produção - em desenvolvimento</div>`:''}
  </main>

  ${showGerenciar?`
  <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur flex items-center justify-center p-4" onclick="if(event.target===this)fecharGerenciar()">
    <div class="w-full max-w-[520px] rounded-xl border border-zinc-800 bg-[#151518] overflow-hidden">
      <div class="p-4 border-b border-zinc-800 flex justify-between items-center"><div class="font-bold text-[13px]">Gerenciar Ruas</div><button onclick="fecharGerenciar()" class="h-7 w-7 grid place-items-center rounded bg-[#1e1e20] border border-zinc-800">✕</button></div>
      <div class="p-4 space-y-2 max-h-[60vh] overflow-auto">
        ${ruas.map((r,i)=>{
          const count=Object.values(posicoes).filter(p=>p.ruaIndex===i).length;
          return `<div class="flex items-center gap-2 p-2 rounded-lg bg-[#0e0e10] border border-zinc-800">
            <input value="${r}" onchange="renomearRua(${i},this.value)" class="flex-1 h-8 px-2 rounded bg-[#151518] border border-zinc-800 text-[11px] mono">
            <span class="text-[10px] mono text-zinc-500">${count} pos</span>
            <button onclick="excluirRua(${i})" class="h-8 w-8 grid place-items-center rounded bg-red-500/10 border border-red-500/20 text-red-300 hover:bg-red-500/20">🗑</button>
          </div>`;
        }).join('')}
      </div>
      <div class="p-4 border-t border-zinc-800 flex justify-between">
        <button onclick="novaRua()" class="h-9 px-3 rounded-lg bg-white text-black text-[11px] font-bold mono">+ Nova Rua</button>
        <button onclick="fecharGerenciar()" class="h-9 px-4 rounded-lg bg-[#1e1e20] border border-zinc-700 text-[11px] mono">Fechar</button>
      </div>
    </div>
  </div>
  `:''}
  `;

  const buscaEl=document.getElementById("buscaInput");
  if(buscaEl){
    buscaEl.addEventListener("input", e=>{busca=e.target.value; render(); document.getElementById("buscaInput").focus(); const v=busca; buscaEl.setSelectionRange(v.length,v.length);});
    buscaEl.addEventListener("keydown", e=>{if(e.key==="Enter"){e.preventDefault()}});
  }
  document.getElementById("fileXlsx")?.addEventListener("change", e=>{if(e.target.files[0])importarArquivo(e.target.files[0])});
  document.getElementById("fileCsv")?.addEventListener("change", e=>{if(e.target.files[0])importarArquivo(e.target.files[0])});
  document.getElementById("fileTxt")?.addEventListener("change", e=>{if(e.target.files[0])importarArquivo(e.target.files[0])});
  const editInput=document.getElementById("editRuaInput");
  if(editInput) editInput.focus();
}

function setTab(t){tab=t; render();}
function selecionarRua(i){ruaSel = ruaSel===i?null:i; render();}
function editarRua(i){editingRua=i; render();}
function salvarRua(i){
  const inp=document.getElementById("editRuaInput");
  if(!inp) return;
  const v=inp.value.trim().toUpperCase()||`RUA ${String(i+1).padStart(2,"0")}`;
  ruas[i]=v;
  editingRua=null;
  saveLocal(); saveFirebase(); render(); feedback("✓ Rua renomeada");
}
function abrirGerenciar(){showGerenciar=true; render();}
function fecharGerenciar(){showGerenciar=false; render();}
function renomearRua(i,val){ ruas[i]=val.toUpperCase(); saveLocal(); saveFirebase(); }
function novaRua(){
  const n=ruas.length+1;
  ruas.push(`RUA ${String(n).padStart(2,"0")}`);
  saveLocal(); saveFirebase(); render();
}
function excluirRua(i){
  const count=Object.values(posicoes).filter(p=>p.ruaIndex===i).length;
  if(!confirm(`Excluir ${ruas[i]}? ${count?`Essa rua tem ${count} posições ocupadas. Vai apagar todas!`:''}`)) return;
  // remove posicoes
  Object.keys(posicoes).forEach(k=>{ if(posicoes[k].ruaIndex===i) delete posicoes[k]; });
  // reindex
  Object.values(posicoes).forEach(p=>{ if(p.ruaIndex>i) p.ruaIndex--; });
  ruas.splice(i,1);
  // rebuild posicoes keys if needed (keep posId same? but ruaIndex changed, so rebuild posId)
  // For simplicity keep old posId but with new ruaIndex - we will keep as is and on render posId will be recomputed, so we need to re-key
  const newPos={};
  Object.values(posicoes).forEach(p=>{
    const newPid=posId(p.ruaIndex,p.nivel,p.div);
    p.posId=newPid;
    newPos[newPid]=p;
  });
  posicoes=newPos;
  saveLocal(); saveFirebase(); render(); feedback("✓ Rua excluída");
}

function feedback(msg){
  const el=document.getElementById("feedback");
  if(!el) return;
  el.innerHTML=`<span class="inline-flex items-center gap-2 px-3 py-1 rounded-full border ${msg.startsWith("✓")?"bg-emerald-500/10 border-emerald-500/20 text-emerald-300":"bg-red-500/10 border-red-500/20 text-red-300"}">${msg}</span>`;
  setTimeout(()=>{ if(el) el.innerHTML=""; },4000);
}

function zerarBase(){
  if(!confirm("Zerar TODO material livre e posições?")) return;
  materiais=[]; posicoes={};
  saveLocal(); saveFirebase(); render(); feedback("✓ Base zerada");
}
function excluirMat(id){
  materiais=materiais.filter(m=>m.id!==id);
  saveLocal(); saveFirebase(); render();
}
function novoMaterial(){
  const cod=prompt("Código material:"); if(!cod) return;
  const txt=prompt("Texto breve:")||"";
  const qtd=Number(prompt("Qtd:")||"1");
  materiais.push({id:"m_"+Date.now(), material:cod, texto:txt, um:"PC", deposito:"100", qtd});
  saveLocal(); saveFirebase(); render();
}

function importarArquivo(file){
  const ext=file.name.split(".").pop().toLowerCase();
  if(ext==="xlsx"||ext==="xls"){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:"array"});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        const json=XLSX.utils.sheet_to_json(sheet,{defval:""});
        processarImport(json);
      }catch(err){ feedback("✗ Erro XLSX: "+err.message); }
    };
    reader.readAsArrayBuffer(file);
  }else{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const text=e.target.result;
        const lines=text.split(/\r?\n/).filter(l=>l.trim());
        if(lines.length<2){ feedback("✗ Arquivo vazio"); return; }
        const sep = lines[0].includes(";")?";": lines[0].includes("\t")?"\t":",";
        const headers=lines[0].split(sep).map(h=>h.toLowerCase().trim());
        const idxMat=headers.findIndex(h=>h.includes("material")&&!h.includes("texto"));
        const idxTexto=headers.findIndex(h=>h.includes("texto"));
        const idxUm=headers.findIndex(h=>h==="um"||h.includes("unidade"));
        const idxDep=headers.findIndex(h=>h.includes("dep"));
        const idxQtd=headers.findIndex(h=>h==="qtd"||h.includes("quant"));
        const idxUtil=headers.findIndex(h=>h.includes("util"));
        const finalQtdIdx = idxQtd>=0?idxQtd:idxUtil;
        const arr=[];
        for(let i=1;i<lines.length;i++){
          const cols=lines[i].split(sep);
          if(!cols[idxMat]) continue;
          arr.push({
            material:cols[idxMat]?.trim(),
            texto:cols[idxTexto]?.trim()||"",
            um:cols[idxUm]?.trim()||"PC",
            deposito:cols[idxDep]?.trim()||"100",
            qtd:Number(String(cols[finalQtdIdx]||"0").replace(",","."))||0
          });
        }
        processarImport(arr, true);
      }catch(err){ feedback("✗ Erro CSV/TXT: "+err.message); }
    };
    reader.readAsText(file);
  }
}

function processarImport(rows, alreadyMapped){
  let novos=[];
  if(alreadyMapped){
    novos=rows.map(r=>({id:"m_"+Date.now()+"_"+Math.random().toString(36).slice(2), material:r.material, texto:r.texto, um:r.um||"PC", deposito:r.deposito||"100", qtd:r.qtd||0}));
  }else{
    // XLSX json
    novos=rows.map(r=>{
      const keys=Object.keys(r);
      const low={}; keys.forEach(k=> low[k.toLowerCase().trim()]=r[k]);
      const mat = low["material"]||low["código"]||low["codigo"]||"";
      if(!mat) return null;
      const texto = low["texto breve"]||low["texto"]||low["descrição"]||low["descricao"]||"";
      const um = low["um"]||"PC";
      const dep = low["depósito"]||low["deposito"]||"100";
      let qtd = low["qtd"]??low["quantidade"]??low["utilização"]??low["utilizacao"]??0;
      qtd=Number(String(qtd).replace(",","."))||0;
      return {id:"m_"+Date.now()+"_"+Math.random().toString(36).slice(2), material:String(mat).trim(), texto:String(texto).trim(), um:String(um).trim(), deposito:String(dep).trim(), qtd};
    }).filter(Boolean);
  }
  if(novos.length===0){ feedback("✗ Nenhum material encontrado"); return; }
  // merge: substitui por material code
  const map=new Map(materiais.map(m=>[m.material,m]));
  novos.forEach(n=> map.set(n.material,n));
  materiais=Array.from(map.values());
  saveLocal(); saveFirebase(); render(); feedback(`✓ ${novos.length} materiais importados`);
}

render();
loadFirebase();
</script>
</body>
</html>
