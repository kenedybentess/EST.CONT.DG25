        }

        .logo{

          display:grid;place-items:center;color:white;font-weight:800;font-size:18px;letter-spacing:-0.5px;
          box-shadow:0 0 0 1px rgba(0,144,255,0.3),0 8px 20px rgba(0,144,255,0.25)
        }
        .brand-title{font-weight:700;letter-spacing:0.04em;font-size:13px;line-height:1.1}
        .brand-sub{opacity:0.6;font-size:10px;letter-spacing:0.18em;margin-top:2px}
        .counters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

        }
        .pill b{color:#fff}
        .pill .dot{width:6px;height:6px;border-radius:999px;background:#0090FF;box-shadow:0 0 8px #0090FF}
        .pill.livres .dot{background:#22c55e;box-shadow:0 0 8px #22c55e}
        .toolbar{
          padding:16px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
          border-bottom:1px solid #1a1a1e;background:#0e0e10;position:sticky;top:64px;z-index:10
        }

        .search-wrap input{
          width:100%;background:#151518;border:1px solid #232326;border-radius:10px;

        }
        .search-wrap input:focus{border-color:#2a2a30;box-shadow:0 0 0 3px rgba(0,144,255,0.15)}
        .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:0.5}
        .btn{

          padding:11px 14px;font-size:12px;font-weight:600;letter-spacing:0.04em;
          cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .15s
        }
        .btn:hover{border-color:#2e2e34;transform:translateY(-1px)}
        .btn:active{transform:translateY(0)}
        .btn-primary{background:#0090FF;border-color:#0090FF;color:white;box-shadow:0 6px 18px rgba(0,144,255,0.25)}
        .btn-primary:hover{background:#0a94ff;box-shadow:0 8px 22px rgba(0,144,255,0.32)}
        .btn:disabled{opacity:0.5;pointer-events:none}

        }

        @media(min-width:1440px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

        }
        .card:hover{border-color:#2f2f36;transform:translateY(-1px)}

        }

        .small{font-size:11px;opacity:0.6}
        *{box-sizing:border-box}
        html,body{margin:0;padding:0;background:#0e0e10;color:#e4e4e7;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace}
        .app-root{min-height:100vh;background:#0e0e10}
        .header{
          position:sticky;top:0;z-index:20;
          background:rgba(14,14,16,0.92);
          backdrop-filter:blur(10px);
          border-bottom:1px solid #232326;
          padding:14px 18px;
          display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
        }
        .brand{display:flex;align-items:center;gap:12px}
        .logo{
          width:34px;height:34px;border-radius:8px;background:#0090FF;
          display:grid;place-items:center;color:white;font-weight:800;font-size:18px;letter-spacing:-0.5px;
          box-shadow:0 0 0 1px rgba(0,144,255,0.3),0 8px 20px rgba(0,144,255,0.25)
        }
        .brand-title{font-weight:700;letter-spacing:0.04em;font-size:13px;line-height:1.1}
        .brand-sub{opacity:0.6;font-size:10px;letter-spacing:0.18em;margin-top:2px}
        .counters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        .pill{
          border:1px solid #232326;background:#151518;border-radius:999px;
          padding:6px 12px;font-size:11px;letter-spacing:0.04em;display:flex;gap:8px;align-items:center
        }
        .pill b{color:#fff}
        .pill .dot{width:6px;height:6px;border-radius:999px;background:#0090FF;box-shadow:0 0 8px #0090FF}
        .pill.livres .dot{background:#22c55e;box-shadow:0 0 8px #22c55e}
        .toolbar{
          padding:16px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
          border-bottom:1px solid #1a1a1e;background:#0e0e10;position:sticky;top:64px;z-index:10
        }
        .search-wrap{flex:1;min-width:220px;position:relative}
        .search-wrap input{
          width:100%;background:#151518;border:1px solid #232326;border-radius:10px;
          padding:12px 12px 12px 38px;color:#e4e4e7;outline:none;font-size:13px;letter-spacing:0.02em
        }
        .search-wrap input:focus{border-color:#2a2a30;box-shadow:0 0 0 3px rgba(0,144,255,0.15)}
        .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:0.5}
        .btn{
          background:#151518;border:1px solid #232326;color:#e4e4e7;border-radius:10px;
          padding:11px 14px;font-size:12px;font-weight:600;letter-spacing:0.04em;
          cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .15s
        }
        .btn:hover{border-color:#2e2e34;transform:translateY(-1px)}
        .btn:active{transform:translateY(0)}
        .btn-primary{background:#0090FF;border-color:#0090FF;color:white;box-shadow:0 6px 18px rgba(0,144,255,0.25)}
        .btn-primary:hover{background:#0a94ff;box-shadow:0 8px 22px rgba(0,144,255,0.32)}
        .btn:disabled{opacity:0.5;pointer-events:none}
        .grid{
          padding:18px;display:grid;gap:12px;
          grid-template-columns:repeat(1,minmax(0,1fr));
        }
        @media(min-width:680px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
        @media(min-width:1024px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
        @media(min-width:1440px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
        .card{
          background:#151518;border:1px solid #232326;border-radius:14px;padding:14px 14px 12px;
          cursor:pointer;transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:10px
        }
        .card:hover{border-color:#2f2f36;transform:translateY(-1px)}
        .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
        .codigo{font-weight:700;font-size:13px;letter-spacing:0.02em;color:#fff;background:#1b1b20;border:1px solid #25252c;border-radius:8px;padding:5px 8px}
        .qtd-badge{
          font-weight:700;font-size:12px;background:rgba(0,144,255,0.12);border:1px solid rgba(0,144,255,0.28);
          color:#7cc6ff;border-radius:999px;padding:5px 10px;white-space:nowrap
        }
        .desc{font-size:12px;line-height:1.45;color:#a1a1aa;min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
        .meta span{font-size:10px;letter-spacing:0.05em;border:1px solid #232326;background:#121214;border-radius:999px;padding:4px 8px;color:#8a8a90}
        .empty{
          padding:40px 18px;text-align:center;color:#6b7280;font-size:13px;border:1px dashed #232326;border-radius:14px;background:#121214;margin:18px
        }
        .modal-overlay{
          position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.78);backdrop-filter:blur(10px);
          display:grid;place-items:center;padding:12px;overflow:auto
        }
        .modal{
          width:min(860px,100%);background:#151518;border:1px solid #232326;border-radius:16px;
          padding:16px;box-shadow:0 20px 60px rgba(0,0,0,0.6);max-height:95vh;overflow:auto
        }
        @media(min-width:860px){.modal{padding:20px}}
        .modal h3{margin:0 0 6px 0;font-size:14px;letter-spacing:0.04em}
        .modal p{margin:0;color:#a1a1aa;font-size:12px;line-height:1.5}
        .field{margin-top:14px;display:flex;flex-direction:column;gap:6px}
        .field label{font-size:11px;letter-spacing:0.08em;opacity:0.7}
        .field input{
          background:#0e0e10;border:1px solid #232326;border-radius:10px;padding:12px 12px;
          color:#e4e4e7;outline:none;font-size:13px
        }
        .field input:focus{border-color:#2a2a30;box-shadow:0 0 0 3px rgba(0,144,255,0.15)}
        .hint{font-size:11px;color:#71717a;line-height:1.4}
        .modal-actions{display:flex;gap:10px;margin-top:16px}
        .modal-actions .btn{flex:1;justify-content:center;padding:13px}
        .toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:360px}
        .toast{
          background:#151518;border:1px solid #232326;border-left:3px solid #0090FF;
          border-radius:12px;padding:12px 12px;color:#e4e4e7;font-size:12px;line-height:1.4;
          box-shadow:0 12px 30px rgba(0,0,0,0.45);animation:slideIn .18s ease
        }
        .toast.ok{border-left-color:#22c55e}
        .toast.err{border-left-color:#ef4444}
        .toast.warn{border-left-color:#f59e0b}
        @keyframes slideIn{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
        .loader{padding:30px;text-align:center;color:#71717a;font-size:12px}
        .small{font-size:11px;opacity:0.6}
        /* novas classes para ruas/posicoes */
        .ruas-wrap{margin-top:14px;border:1px solid #232326;border-radius:12px;background:#121214;padding:12px}
        .ruas-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
        .ruas-head h4{margin:0;font-size:11px;letter-spacing:0.12em;color:#d4d4d8}
        .ruas-grid{display:flex;flex-wrap:wrap;gap:8px}
        .rua-btn{
          border:1px solid #232326;background:#1a1a1e;border-radius:10px;padding:8px 10px;min-width:72px;
          display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:all .15s;text-align:left
        }
        .rua-btn:hover{border-color:#2f2f36;transform:translateY(-1px)}
        .rua-btn.active{border-color:#0090FF;background:rgba(0,144,255,0.12);box-shadow:0 0 0 2px rgba(0,144,255,0.15) inset}
        .rua-btn b{color:#fff;font-size:13px}
        .rua-meta{display:flex;gap:6px;flex-wrap:wrap}
        .rua-meta span{font-size:9px;padding:2px 6px;border-radius:999px;border:1px solid #2a2a30;background:#151518;color:#9ca3af}
        .rua-meta span.free{border-color:rgba(34,197,94,0.3);color:#86efac;background:rgba(34,197,94,0.12)}
        .pos-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
        .pos-toolbar input{
          flex:1;min-width:140px;background:#0e0e10;border:1px solid #232326;border-radius:10px;padding:10px 10px;color:#e4e4e7;font-size:12px;outline:none
        }
        .pos-toolbar input:focus{border-color:#2a2a30;box-shadow:0 0 0 3px rgba(0,144,255,0.12)}
        .toggle{display:flex;align-items:center;gap:6px;font-size:11px;color:#a1a1aa;cursor:pointer;user-select:none}
        .toggle input{accent-color:#22c55e}
        .pos-list{
          margin-top:10px;max-height:300px;overflow:auto;border:1px solid #1e1e22;border-radius:10px;background:#0e0e10;
          display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:1px;padding:1px
        }
        @media(min-width:520px){.pos-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
        @media(min-width:860px){.pos-list{grid-template-columns:repeat(3,minmax(0,1fr))}}
        .pos-item{
          background:#151518;border-radius:8px;padding:10px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;
          cursor:pointer;transition:all .12s;border:1px solid transparent;text-align:left
        }
        .pos-item:hover{border-color:#2a2a30;background:#1b1b20}
        .pos-item.selected{border-color:#0090FF;background:rgba(0,144,255,0.14)}
        .pos-code{font-weight:700;font-size:12px;color:#e4e4e7;letter-spacing:0.02em}
        .pos-sub{font-size:10px;color:#71717a;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
        .badge{font-size:9px;font-weight:700;letter-spacing:0.06em;padding:4px 7px;border-radius:999px;border:1px solid;white-space:nowrap}
        .badge-free{background:rgba(34,197,94,0.14);border-color:rgba(34,197,94,0.3);color:#86efac}
        .badge-occ{background:rgba(168,85,247,0.14);border-color:rgba(168,85,247,0.32);color:#d8b4fe}
        .badge-sel{background:rgba(0,144,255,0.18);border-color:rgba(0,144,255,0.4);color:#7cc6ff}
